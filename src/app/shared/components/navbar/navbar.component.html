<nav class="bg-secondary border-b border-surface-light">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <!-- Logo -->
      <a routerLink="/" class="flex items-center gap-2 text-xl font-bold" (click)="closeMobileMenu()">
        <span class="text-primary text-2xl">&#9899;</span>
        <span class="text-text">Gym</span><span class="text-primary">Track</span>
      </a>

      <!-- Desktop nav -->
      <div class="hidden md:flex items-center gap-6">
        @if (auth.isAuthenticated()) {
          <a routerLink="/dashboard" routerLinkActive="text-primary" class="text-text-muted hover:text-text transition-colors">Dashboard</a>
          <a routerLink="/workouts" routerLinkActive="text-primary" class="text-text-muted hover:text-text transition-colors">Workouts</a>
          <a routerLink="/schedule" routerLinkActive="text-primary" class="text-text-muted hover:text-text transition-colors">Schedule</a>
          <a routerLink="/membership" routerLinkActive="text-primary" class="text-text-muted hover:text-text transition-colors">Membership</a>
        }
      </div>

      <!-- Desktop auth -->
      <div class="hidden md:flex items-center gap-4">
        @if (auth.isAuthenticated()) {
          <a routerLink="/profile" class="text-text-muted hover:text-text transition-colors">
            {{ auth.getUserName() }}
          </a>
          <button (click)="auth.logout()" class="btn-secondary text-sm py-2 px-4">Logout</button>
        } @else {
          <button (click)="auth.login()" class="btn-primary text-sm py-2 px-4">Login</button>
        }
      </div>

      <!-- Mobile hamburger -->
      <button class="md:hidden text-text-muted hover:text-text" (click)="toggleMobileMenu()">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          @if (mobileMenuOpen()) {
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          } @else {
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          }
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile menu -->
  @if (mobileMenuOpen()) {
    <div class="md:hidden bg-secondary border-t border-surface-light">
      <div class="px-4 py-3 space-y-2">
        @if (auth.isAuthenticated()) {
          <a routerLink="/dashboard" routerLinkActive="text-primary" class="block py-2 text-text-muted hover:text-text" (click)="closeMobileMenu()">Dashboard</a>
          <a routerLink="/workouts" routerLinkActive="text-primary" class="block py-2 text-text-muted hover:text-text" (click)="closeMobileMenu()">Workouts</a>
          <a routerLink="/schedule" routerLinkActive="text-primary" class="block py-2 text-text-muted hover:text-text" (click)="closeMobileMenu()">Schedule</a>
          <a routerLink="/membership" routerLinkActive="text-primary" class="block py-2 text-text-muted hover:text-text" (click)="closeMobileMenu()">Membership</a>
          <a routerLink="/profile" routerLinkActive="text-primary" class="block py-2 text-text-muted hover:text-text" (click)="closeMobileMenu()">Profile</a>
          <hr class="border-surface-light">
          <button (click)="auth.logout()" class="block w-full text-left py-2 text-error">Logout</button>
        } @else {
          <button (click)="auth.login()" class="btn-primary w-full">Login</button>
        }
      </div>
    </div>
  }
</nav>
