<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <h1 class="text-3xl font-bold mb-8">Create Workout</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
    <!-- Workout info -->
    <div class="gym-card space-y-4">
      <div>
        <label class="block text-sm font-medium text-text-muted mb-1">Workout Name</label>
        <input formControlName="name" type="text" placeholder="e.g., Morning Push Day"
               class="w-full bg-surface-light border border-surface-light rounded-lg px-4 py-3 text-text placeholder-text-muted/50 focus:border-primary focus:outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-text-muted mb-1">Description (optional)</label>
        <textarea formControlName="description" rows="2" placeholder="Brief description..."
                  class="w-full bg-surface-light border border-surface-light rounded-lg px-4 py-3 text-text placeholder-text-muted/50 focus:border-primary focus:outline-none resize-none"></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-text-muted mb-1">Category</label>
        <select formControlName="category"
                class="w-full bg-surface-light border border-surface-light rounded-lg px-4 py-3 text-text focus:border-primary focus:outline-none">
          @for (cat of categories; track cat.value) {
            <option [value]="cat.value">{{ cat.label }}</option>
          }
        </select>
      </div>
    </div>

    <!-- Exercises -->
    <div class="space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-xl font-semibold">Exercises</h2>
        <button type="button" (click)="addExercise()" class="btn-secondary text-sm py-2 px-4">+ Add Exercise</button>
      </div>

      <div formArrayName="exercises" class="space-y-4">
        @for (exercise of exercises.controls; track $index; let i = $index) {
          <div [formGroupName]="i" class="gym-card">
            <div class="flex items-center justify-between mb-4">
              <h3 class="font-medium text-text-muted">Exercise {{ i + 1 }}</h3>
              @if (exercises.length > 1) {
                <button type="button" (click)="removeExercise(i)" class="text-text-muted hover:text-error transition-colors">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                  </svg>
                </button>
              }
            </div>

            <div class="space-y-3">
              <input formControlName="name" type="text" placeholder="Exercise name"
                     class="w-full bg-surface-light border border-surface-light rounded-lg px-4 py-2 text-text placeholder-text-muted/50 focus:border-primary focus:outline-none">

              <div class="grid grid-cols-3 gap-3">
                <div>
                  <label class="block text-xs text-text-muted mb-1">Sets</label>
                  <input formControlName="sets" type="number" min="1"
                         class="w-full bg-surface-light border border-surface-light rounded-lg px-3 py-2 text-text focus:border-primary focus:outline-none">
                </div>
                <div>
                  <label class="block text-xs text-text-muted mb-1">Reps</label>
                  <input formControlName="reps" type="number" min="1"
                         class="w-full bg-surface-light border border-surface-light rounded-lg px-3 py-2 text-text focus:border-primary focus:outline-none">
                </div>
                <div>
                  <label class="block text-xs text-text-muted mb-1">Weight (kg)</label>
                  <input formControlName="weight" type="number" min="0" step="0.5" placeholder="-"
                         class="w-full bg-surface-light border border-surface-light rounded-lg px-3 py-2 text-text placeholder-text-muted/50 focus:border-primary focus:outline-none">
                </div>
              </div>

              <input formControlName="notes" type="text" placeholder="Notes (optional)"
                     class="w-full bg-surface-light border border-surface-light rounded-lg px-4 py-2 text-text text-sm placeholder-text-muted/50 focus:border-primary focus:outline-none">
            </div>
          </div>
        }
      </div>
    </div>

    <!-- Actions -->
    <div class="flex gap-4">
      <button type="submit" [disabled]="form.invalid" class="btn-primary flex-1 disabled:opacity-50 disabled:cursor-not-allowed">
        Create Workout
      </button>
      <button type="button" (click)="cancel()" class="btn-secondary">Cancel</button>
    </div>
  </form>
</div>
